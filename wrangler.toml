# Support-MCP relay Worker.
# Before the first deploy, replace the four REPLACE_ME values (see README,
# "Deploy your own"). The account comes from `wrangler login` or
# CLOUDFLARE_ACCOUNT_ID, so it is not pinned here.
name = "support-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"
# OAuth reads an MCP client's metadata document from the address the client
# gives as its client_id. This flag makes that fetch reach only public hosts
# (never this Worker's own zone), which is what keeps it from being abused.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
routes = [{ pattern = "support.REPLACE_ME.example", custom_domain = true }]

[observability]
enabled = true

[vars]
# Your Zero Trust team domain and the AUD tag of the Access app guarding /mcp.
ACCESS_TEAM_DOMAIN = "REPLACE_ME.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_ME"
# Only with OAuth, when cf/access-setup.sh ran with OAUTH=1: the AUD tag of the
# second Access application, which covers /mcp and /w/*. A service token's JWT
# for it is accepted on the MCP addresses (never on /api). Leave empty otherwise.
ACCESS_MCP_AUD = ""
# Comma-separated identities (emails or service token client ids). They alone
# may create workspaces (POST /api/v1/w), and with this empty nobody can. They
# are also the only ones who may add the default workspace's first member; if
# empty, any caller Access admits may, as admin.
DEPLOYMENT_ADMINS = ""

# Sign-in for people (docs/sign-in-setup.md). Nothing here is secret. Leave a
# method's id empty to hide it. People can sign in only if a team has added
# them (or they are in DEPLOYMENT_ADMINS).
# Your public address, with no path (https://support.example.com). Required for
# sign-in, and it is the issuer of the OAuth tokens MCP clients use.
PUBLIC_ORIGIN = ""
GOOGLE_CLIENT_ID = ""
MICROSOFT_CLIENT_ID = ""
# Comma-separated Microsoft tenant ids that may sign in. Empty allows any.
MICROSOFT_TENANTS = ""
# How emailed sign-in links are sent: "resend", or empty for no email option.
MAIL_PROVIDER = ""
# The verified sender address, such as "Support <login@support.example.com>".
MAIL_FROM = ""
SIGNIN_IDLE_HOURS = "12"
SIGNIN_MAX_DAYS = "14"
# The time zone a team's business hours use until the team sets its own: an IANA name as
# Intl lists it, such as "Asia/Jerusalem". Empty, or a name that is not a zone, means UTC.
# A change reaches PCs at their next check-in.
DEFAULT_TIME_ZONE = ""
# Updates for saved PCs (docs/development.md, "Releases"). RELEASE_SIGNATURE and
# RELEASE_SIGNED_AT come from scripts/sign-release.mjs at each deploy (pass them
# with --var); with either empty, no PC is offered an update. UPDATE_ROLLOUT
# empty follows the stages (10%, then half, then all, a day apart), "pause"
# offers nothing, and a whole number 0 to 100 pins the share of PCs.
RELEASE_SIGNATURE = ""
RELEASE_SIGNED_AT = ""
UPDATE_ROLLOUT = ""
# The operator's stop for the whole relay. Any non-empty value (for example "1")
# refuses every MCP tool call, every connect to a saved PC and every /agent
# request, and ends the live sessions on their next request. Teams cannot lift it.
# Empty is normal. Change it with `wrangler deploy --var EMERGENCY_STOP:1`, or in
# the Cloudflare dashboard under the Worker's variables; clear it to run again.
# A single workspace is stopped with POST /api/v1/w/<slug>/stop instead.
EMERGENCY_STOP = ""
# Secrets, set with `wrangler secret put <NAME>`, never here: AUTH_SECRET
# (32 or more random characters), GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET
# and RESEND_API_KEY.

# Team data: members, roles and the team log, one shared database with every
# row keyed by workspace. Create it with `wrangler d1 create support-mcp`, put
# its id here, then `wrangler d1 migrations apply support-mcp --remote`. That
# runs every file in migrations/ in name order.
[[d1_databases]]
binding = "DB"
database_name = "support-mcp"
database_id = "REPLACE_ME"
migrations_dir = "migrations"

# OAuth for MCP clients (docs/mcp-clients.md): grants, tokens and registered
# clients, stored hashed. Create it with `wrangler kv namespace create OAUTH_KV`
# and put the id it prints here. The binding name must stay OAUTH_KV. Without
# it, OAuth is off and the MCP addresses admit only Access logins and service
# tokens. The free plan allows 100,000 reads and 1,000 writes a day.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_ME"

# Durable Objects: one Session per pairing code, one Registry per workspace, and one
# AgentTask per built-in agent task (plus a fresh one for each model check).
[[durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[durable_objects.bindings]]
name = "AGENT_TASK"
class_name = "AgentTask"

# One hourly run (src/sweep.js): it raises "missing" for saved PCs not seen for 7 days,
# rings connected PCs that are due an update, and deletes notifications older than 30 days. A free account allows a few Cron
# Triggers in all, so check how many it already uses. If you deploy with a copy
# of this file, give the copy the same trigger, or the run never happens.
[triggers]
crons = ["17 * * * *"]

# Free plan requires SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session", "Registry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentTask"]

# Import the PowerShell agent template as text.
[[rules]]
type = "Text"
globs = ["**/*.ps1"]
fallthrough = true
