# The Mac agent's Rust workspace: the platform-neutral core (support-core) and the macOS app
# (support-mac, binary `support`). Every dependency is pinned with `=` and Cargo.lock is
# committed, so a build here, in CI and on the Mac uses the same code.
[workspace]
members = ["core", "app"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
