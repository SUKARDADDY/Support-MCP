[package]
name = "support-mac"
# The Mac app's release. It is the core's version, so the hello, the check-in and the bundle all say the same.
version = "1.0.0"
description = "The Support-MCP Mac app: the root service, the session helper, setup and uninstall"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "support_mac"
path = "src/lib.rs"

# One binary with several roles, chosen by the first argument (src/role.rs).
[[bin]]
name = "support"
path = "src/main.rs"

[dependencies]
support-core = { path = "../core" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
url = "=2.5.8"
libc = "=0.2.191"
# Reads the Info.plist of each app for list_programs (binary or XML).
plist = { version = "=1.10.3", default-features = false }

# The macOS frameworks, through objc2. They are only built for a Mac; the rest of the crate runs and is tested on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-screen-capture-kit = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-application-services = "=0.3.2"
objc2-image-io = "=0.3.2"
objc2-security = "=0.3.2"
