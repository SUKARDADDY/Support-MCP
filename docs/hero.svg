<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
  <title id="t">Support-MCP at a glance</title>
  <desc id="d">On the left, Claude Code calls the session_create, run and put_file tools. In the middle, a Cloudflare Worker relays them. On the right, the customer's PC shows a small Remote support window in the corner of the screen. It says an agent is connected, shows how long, when the session ends by itself, and has an End session button.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1c2433"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f38020"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .sans { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .cap { font-size: 11px; letter-spacing: 2px; fill: #7d8590; font-weight: 600; }
      .t { font-size: 12px; fill: #c9d1d9; }
      .dim { fill: #7d8590; }
      .ok { fill: #3fb950; }
      .bad { fill: #f85149; }
      .tool { fill: #d97757; }
      .w { font-size: 11px; fill: #1b1b1b; }
      .flow { stroke-dasharray: 4 5; animation: flow 1.1s linear infinite; }
      .flow.back { animation-direction: reverse; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="470" rx="16" fill="#0d1117"/>
  <rect width="1000" height="470" rx="16" fill="url(#dots)"/>

  <!-- column captions -->
  <text class="sans cap" x="24" y="46">OPERATOR · CLAUDE CODE</text>
  <text class="sans cap" x="500" y="46" text-anchor="middle">RELAY</text>
  <text class="sans cap" x="596" y="46">CUSTOMER PC · WINDOWS</text>

  <!-- operator terminal -->
  <g>
    <rect x="24" y="62" width="380" height="350" rx="10" fill="#161b22" stroke="#30363d"/>
    <path d="M24 72a10 10 0 0 1 10-10h360a10 10 0 0 1 10 10v20H24z" fill="#1f252e"/>
    <circle cx="42" cy="77" r="5" fill="#ff5f57"/>
    <circle cx="58" cy="77" r="5" fill="#febc2e"/>
    <circle cx="74" cy="77" r="5" fill="#28c840"/>
    <text class="mono" x="214" y="81" text-anchor="middle" font-size="11" fill="#7d8590">claude</text>

    <g class="mono t">
      <text x="40" y="118"><tspan fill="#7aa2f7">&gt;</tspan> the front receipt printer stopped</text>

      <text x="40" y="150"><tspan class="tool">●</tspan> session_create</text>
      <text x="40" y="169"><tspan class="dim">&#160;&#160;⎿&#160;</tspan>https://support.example.com/j/…?client=app</text>

      <text x="40" y="199"><tspan class="tool">●</tspan> run <tspan class="dim">Get-PnpDevice -PresentOnly -Class USB</tspan></text>
      <text x="40" y="218"><tspan class="dim">&#160;&#160;⎿&#160;</tspan>USB Printing Support&#160;&#160;&#160;&#160;&#160;<tspan class="bad">Error</tspan></text>

      <text x="40" y="248"><tspan class="tool">●</tspan> run <tspan class="dim">Start-Process pnputil -Verb RunAs …</tspan></text>
      <text x="40" y="267"><tspan class="dim">&#160;&#160;⎿&#160;</tspan>customer clicked Yes · USB001 is back</text>

      <text x="40" y="297"><tspan class="tool">●</tspan> put_file <tspan class="dim">C:\Users\pos\clear-printer.ps1</tspan></text>
      <text x="40" y="316"><tspan class="dim">&#160;&#160;⎿&#160;</tspan>2.1 KiB written</text>

      <text x="40" y="346"><tspan class="tool">●</tspan> run <tspan class="dim">&amp; C:\Users\pos\clear-printer.ps1</tspan></text>
      <text x="40" y="365"><tspan class="dim">&#160;&#160;⎿&#160;</tspan><tspan class="ok">printer acknowledged · receipt printed</tspan></text>

      <rect class="pulse" x="40" y="383" width="8" height="15" fill="#c9d1d9"/>
    </g>
  </g>

  <!-- connectors -->
  <line class="flow" x1="404" y1="232" x2="432" y2="232" stroke="#d97757" stroke-width="2"/>
  <line class="flow back" x1="404" y1="260" x2="432" y2="260" stroke="#7d8590" stroke-width="2"/>
  <line class="flow" x1="568" y1="232" x2="596" y2="232" stroke="#f38020" stroke-width="2"/>
  <line class="flow back" x1="568" y1="260" x2="596" y2="260" stroke="#7d8590" stroke-width="2"/>

  <!-- relay -->
  <g class="sans">
    <rect x="432" y="146" width="136" height="184" rx="10" fill="#161b22" stroke="url(#glow)" stroke-width="1.5"/>
    <text x="500" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Cloudflare Worker</text>
    <text x="500" y="194" text-anchor="middle" font-size="11" fill="#7d8590">+ Durable Objects</text>
    <line x1="446" y1="208" x2="554" y2="208" stroke="#30363d"/>
    <text class="mono" x="500" y="236" font-size="10.5" text-anchor="middle"><tspan fill="#d97757">/mcp</tspan><tspan fill="#e6edf3">&#160;&#160;▶&#160;&#160;</tspan><tspan fill="#f38020">/agent</tspan></text>
    <text class="mono" x="500" y="264" font-size="10.5" text-anchor="middle" fill="#7d8590">/mcp&#160;&#160;◀&#160;&#160;/agent</text>
    <line x1="446" y1="280" x2="554" y2="280" stroke="#30363d"/>
    <text x="500" y="300" text-anchor="middle" font-size="11" fill="#7d8590">audit log</text>
    <text x="500" y="316" text-anchor="middle" font-size="11" fill="#7d8590">24 h hard limit</text>
  </g>

  <!-- customer desktop with the corner window (WPF) -->
  <g class="sans">
    <rect x="596" y="62" width="380" height="350" rx="8" fill="#1d2634" stroke="#3b4048"/>
    <rect x="612" y="78" width="120" height="70" rx="4" fill="#2a3547"/>
    <rect x="612" y="160" width="190" height="10" rx="3" fill="#2a3547"/>
    <rect x="612" y="178" width="150" height="10" rx="3" fill="#2a3547"/>
    <rect x="596" y="388" width="380" height="24" rx="0" fill="#141b27"/>
    <path d="M596 412h380v-4a8 8 0 0 1-8 8H604a8 8 0 0 1-8-8z" fill="#141b27"/>

    <rect x="646" y="236" width="318" height="144" rx="8" fill="#ffffff" stroke="#d0d5dd"/>
    <path d="M646 244a8 8 0 0 1 8-8h302a8 8 0 0 1 8 8v2H646z" fill="#1f9d55"/>
    <text x="660" y="266" font-size="11" font-weight="600" fill="#5b6472">Remote support</text>
    <rect x="660" y="278" width="36" height="36" rx="8" fill="#1f9d55" opacity=".16"/>
    <circle class="pulse" cx="678" cy="296" r="6" fill="#1f9d55"/>
    <text x="706" y="292" font-size="12.5" font-weight="600" fill="#141a24">A remote support agent is</text>
    <text x="706" y="308" font-size="12.5" font-weight="600" fill="#141a24">connected to your machine.</text>
    <text x="660" y="334" font-size="11.5" fill="#5b6472">Connected for <tspan class="mono" fill="#141a24">00:04:12</tspan></text>
    <text x="660" y="350" font-size="11.5" fill="#5b6472">Ends by itself Mon 2 Nov, 14:02</text>
    <rect x="852" y="340" width="100" height="30" rx="6" fill="#fdecea"/>
    <text x="902" y="359" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b42318">End session</text>
  </g>

  <text class="sans" x="500" y="446" text-anchor="middle" font-size="13" fill="#7d8590">The customer sees when support is connected and when it is working, and can end the session at any time.</text>
</svg>
