# The Mac agent's Rust workspace: the platform-neutral core (support-core) and the macOS app
# (support-mac, binary `support`). Every dependency is pinned with `=` and Cargo.lock is
# committed, so a build here, in CI and on the Mac uses the same code.
[workspace]
members = ["core", "app"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The macOS update test's four builds (packaging/build.sh with SUPPORT_CARGO_PROFILE=update-test): the release profile
# without LTO, so each takes a fraction of the time. Releases use the release profile above.
[profile.update-test]
inherits = "release"
lto = false
codegen-units = 16
