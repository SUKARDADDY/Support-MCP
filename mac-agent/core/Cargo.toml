[package]
name = "support-core"
# The version the Mac app reports as its app_version and in its session hello. The Mac has its own version line
# (approved call 7), apart from the relay's VERSION, starting at 1.1.0. The relay lets a saved PC be connected only
# from 1.0.0 (src/devices.js MIN_SESSION_VERSION), which 1.1.0 passes. app/Cargo.toml carries the same version.
version = "1.1.0"
description = "The platform-neutral core of the Support-MCP Mac client"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "support_core"
path = "src/lib.rs"

[[bin]]
name = "support-core-e2e"
path = "src/bin/support_core_e2e.rs"

# A build for the macOS update test only (docs/development.md, "Mac updates"). It trusts the throwaway release key given
# at build time in SUPPORT_TEST_RELEASE_KEY instead of release-key.pub, reports SUPPORT_TEST_VERSION, and may download
# from loopback over http, starting at SUPPORT_TEST_DOWNLOAD_ORIGIN. A build without the feature fails to compile when
# any of the three is set (src/lib.rs), so the app that ships never has them.
[features]
test-release = []

[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
# TLS is rustls with the operating system's roots (rustls-platform-verifier), so no OpenSSL anywhere.
# The crypto provider is ring: the process installs it once (tls::init) before any connection.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
sha2 = "=0.10.9"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
rand = "=0.9.5"
url = "=2.5.8"
# NFC for comparing Mac path names (already in the tree through url).
icu_normalizer = "=2.4.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
