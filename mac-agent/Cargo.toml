# The Mac agent's Rust workspace. PR 2 holds the platform-neutral core (support-core). The macOS
# app (PR 3 on) joins as another member. Every dependency is pinned with `=` and Cargo.lock is
# committed, so a build here, in CI and on the Mac uses the same code.
[workspace]
members = ["core"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
