name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# This runs on our own runner, so outside code must never reach it. Two
# repository settings are the gate: only collaborators can open pull requests,
# and a workflow from any outside contributor waits for approval. The `if`
# below is a second line for pull requests from forks. A fork can edit this
# file, so it is not a boundary on its own.
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, support-mcp]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The OAuth library is the one npm package. npm test loads it through a
      # stand-in for the workerd-only cloudflare:workers module (test/stubs/).
      - run: npm ci --ignore-scripts
      - run: npm test

  # Runs on a GitHub-hosted Windows runner with the .NET Framework v4 compiler.
  # It builds the app from source against the pinned .NET Framework 4.5.2 reference
  # assemblies, runs the native tests, and checks that the exe committed in
  # src/app-bundle.json is the build of the committed source.
  windows-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Show the compiler version
        shell: pwsh
        run: (Get-Item "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe").VersionInfo.ProductVersion
      - name: Fetch the pinned .NET Framework 4.5.2 reference assemblies
        id: refs
        shell: pwsh
        run: |
          $refs = ./scripts/fetch-net452-refs.ps1 -Destination "$env:RUNNER_TEMP\net452-refs"
          "dir=$refs" >> $env:GITHUB_OUTPUT
      - name: Build the app from source
        shell: pwsh
        run: ./scripts/build-app.ps1 -ReferenceDir "${{ steps.refs.outputs.dir }}" -OutDir "$env:RUNNER_TEMP\app-build"
      - name: Run the native tests
        shell: pwsh
        run: ./scripts/test-app-native.ps1 -ReferenceDir "${{ steps.refs.outputs.dir }}" -WorkDir "$env:RUNNER_TEMP\app-native"
      - name: Check the committed exe against the fresh build
        run: node scripts/verify-app-binary.mjs "$env:RUNNER_TEMP\app-build\support-mcp-app.exe"
      - name: Upload the fresh build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-app
          path: ${{ runner.temp }}/app-build/support-mcp-app.exe
          if-no-files-found: error

  # The technician app (technician-app/, a Tauri 2 shell with a Rust core and React screens).
  # On a GitHub-hosted Windows runner it runs the Rust tests and the screens' tests, builds the
  # NSIS installer with `tauri build` and checks it is under 25 MB, then installs an end-to-end
  # build silently and drives it against a real local relay (technician-app/e2e/run.mjs,
  # docs/technician-app.md, "How it is tested"). The installer is uploaded as an artifact.
  technician-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            technician-app/package-lock.json
      - name: Use the stable Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      # The repository allows only GitHub's own actions, so the Rust cache is actions/cache.
      - name: Cache the Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            technician-app/src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('technician-app/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      # The relay's one npm package, which `wrangler dev` bundles for the end-to-end run.
      - run: npm ci --ignore-scripts
      - name: Install the screens' packages
        working-directory: technician-app
        run: npm ci --ignore-scripts
      # The installer that ships checks releases of this repository against the project's key.
      # SUPPORT_RELEASE_REPO and SUPPORT_RELEASE_KEY are for a `test-release` build only, and the
      # build stops with a compile error if either is set without that feature. This says so
      # earlier and names the cause.
      - name: Check the shipping build has no test release overrides
        shell: pwsh
        run: |
          foreach ($name in 'SUPPORT_RELEASE_REPO', 'SUPPORT_RELEASE_KEY') {
            if (Test-Path "env:$name") { throw "$name is set in the environment of the shipping build" }
          }
      - name: Test the screens
        working-directory: technician-app
        run: npm test
      - name: Build the screens (the Rust tests read the built files)
        working-directory: technician-app
        run: npm run build
      - name: Test the Rust core
        working-directory: technician-app/src-tauri
        run: cargo test --locked
      # The Rust cache restores target/, old installers included, so the bundle folder is
      # cleared before each build and the installer is picked by this version's file name.
      - name: Build the installer
        working-directory: technician-app
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          npx tauri build
      - name: Check the installer is under 25 MB
        shell: pwsh
        run: |
          $version = (Get-Content technician-app/package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "technician-app/src-tauri/target/release/bundle/nsis/Support_${version}_x64-setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "tauri build made no NSIS installer for $version" }
          $mb = [math]::Round($installer.Length / 1MB, 2)
          "$($installer.Name) is $mb MB"
          if ($installer.Length -ge 25MB) { throw "the installer is $mb MB, over the 25 MB limit" }
          New-Item -ItemType Directory -Force -Path release-installer | Out-Null
          Copy-Item $installer.FullName release-installer/
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-technician-installer
          path: release-installer/*-setup.exe
          if-no-files-found: error
      # The end-to-end build writes its sign-in address to a file instead of opening a browser, and
      # starts on the relay the run starts. It is built apart from the installer above, which is
      # the one that ships.
      - name: Build the end-to-end installer
        working-directory: technician-app
        env:
          SUPPORT_DEFAULT_RELAY: http://127.0.0.1:8787
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          npx tauri build --features e2e
      - name: Install Playwright's Chromium
        working-directory: technician-app
        run: npx playwright install chromium
      - name: Install the end-to-end app silently
        id: install
        shell: pwsh
        run: |
          $version = (Get-Content technician-app/package.json -Raw | ConvertFrom-Json).version
          $setup = Get-Item "technician-app/src-tauri/target/release/bundle/nsis/Support_${version}_x64-setup.exe"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dirs = @("$env:LOCALAPPDATA\Support", "$env:LOCALAPPDATA\Programs\Support")
          $exe = $dirs | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Filter *.exe } | Where-Object { $_.Name -notmatch '^uninstall' } | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem $env:LOCALAPPDATA -Directory | Select-Object -ExpandProperty FullName
            throw 'the silent install left no app under %LOCALAPPDATA%'
          }
          "installed $($exe.FullName)"
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
      # The runner is elevated, so WebView2 ignores its debug-port environment variable. A machine
      # policy opens the port for this app's exe instead.
      - name: Open WebView2's debug port for the app
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name '${{ steps.install.outputs.name }}' -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null
          Get-ItemProperty -Path $key
      - name: Run the end-to-end test
        working-directory: technician-app
        env:
          APP_EXE: ${{ steps.install.outputs.exe }}
          E2E_OUT: ${{ github.workspace }}/e2e-out
        run: npm run e2e
      - name: Upload what the end-to-end run saw
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technician-app-e2e
          path: e2e-out
          if-no-files-found: ignore
