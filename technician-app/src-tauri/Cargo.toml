[package]
name = "support-technician-app"
version = "1.0.0"
description = "The Support-MCP technician app for Windows"
authors = ["Support-MCP"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "technician_app"
path = "src/lib.rs"

[[bin]]
name = "support-technician"
path = "src/main.rs"

[features]
# The end-to-end build: instead of opening the system browser, sign-in writes the
# authorize address to the file named by SUPPORT_E2E_AUTHORIZE_FILE, so a test can walk
# the sign-in pages in its own browser. Never part of a release build.
e2e = []
# A build for testing a release: SUPPORT_RELEASE_REPO and SUPPORT_RELEASE_KEY, set when it is
# built, name the repository to look at and the throwaway key its notes are signed with. Only
# this feature reads them. Without it, setting either at build time stops the build
# (build.rs and lib.rs), so a shipped installer can never carry them.
test-release = []
# Set by `tauri build`: the screens are served from the files built into the exe.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# TLS is the operating system's (Schannel on Windows), so no C compiler is needed there.
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "form", "http2", "system-proxy"] }
tokio = { version = "=1.54.1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
url = "=2.5.8"
base64 = "=0.22.1"
sha2 = "=0.10.9"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
rand = "=0.9.5"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
